# BootScope display filter and highlight rules
# Copy to /data/adb/bootscope/rules.conf to override persistently across module upgrades.
# Format: TYPE=VALUE (case-insensitive)
#   ignore_cmd  Suppress expected benign init Command failures (command prefix)
#   ignore_svc  Suppress expected benign init Service non-zero exits (service name)
#   ignore_tag  Suppress noisy logcat *:E tags (exact tag)
#   module_key  Highlight matching errors in theme cyan (M ERR)
#   redact_key  Mask sensitive key/value data in-place (***)

ignore_cmd=rm
ignore_cmd=symlink
ignore_cmd=chmod
ignore_cmd=chown
ignore_cmd=start zygote_secondary
ignore_cmd=start vendor.audio-
ignore_cmd=start audioproxy_service

ignore_svc=misctrl
ignore_svc=modem_logging_stop

module_key=bootscope

redact_key=imei
redact_key=imsi
redact_key=iccid
redact_key=bssid
redact_key=ssid=
redact_key=password
redact_key=secret
redact_key=token=
redact_key=cookie
redact_key=serialno=
redact_key=android_id
redact_key=mac=
redact_key=macaddr
