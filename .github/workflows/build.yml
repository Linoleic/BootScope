name: Build and Release BootScope

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'webui/package-lock.json'

      - name: Resolve Android NDK
        run: |
          if [ -z "$ANDROID_NDK_HOME" ] && [ -n "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          fi

      - name: Build module ZIP (native C++ core + WebUI)
        run: python3 build_module.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum bootscope-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bootscope-module
          path: |
            dist/bootscope-*.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/bootscope-*.zip
            dist/SHA256SUMS.txt
