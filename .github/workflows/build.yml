name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-and-test:
    name: Build and test BootScope
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'webui/package-lock.json'

      - name: Resolve Android NDK
        run: |
          if [ -z "$ANDROID_NDK_HOME" ] && [ -n "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          fi

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python3 tools/ci_release.py --tag "$RELEASE_TAG"

      - name: Build module ZIP (native C++ core + WebUI)
        run: python3 build_module.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify built package and clean source tree
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          set -- dist/bootscope-v*.zip
          echo "Built package count: $#"
          echo "Built package: $1"
          test "$#" -eq 1
          git status --short
          python3 tools/ci_release.py --tag "$RELEASE_TAG" --package "$1" --revision "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootscope-module
          path: dist/bootscope-v*.zip
          if-no-files-found: error
          retention-days: 14
